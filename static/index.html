<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TarocchAI — The Liminal Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=JetBrains+Mono:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scene" id="room">
        <div id="candle-light"></div>

        <div class="room-base"></div>
        <div class="room-perspective"><div class="room-floor-plane"></div></div>
        <div class="room-ceiling"><div class="room-ceiling-plane"></div></div>
        <div class="horizon"></div>

        <div class="field">
            <div class="field-layer l1"></div>
            <div class="field-layer l2"></div>
            <div class="field-layer l3"></div>
        </div>
    <!-- MT's voice — materialises on the table, above the cards -->
    <div class="mt-voice" id="voice-text"></div>
        <div class="slab">
            <div class="slab-top">
                <div class="slab-pattern" id="slab-pattern"></div>
                <div class="slab-far-line"></div>
                <div class="slab-frame"></div>
                <div class="slab-far-shadow"></div>
            </div>
            <div class="slab-face"></div>



            <!-- Cards — moved down closer to user -->
            <div class="cards-row" id="deck-area"></div>

            <!-- Floating flame candle — total juxtaposition -->
            <div class="floating-flame" id="candle-container">
                <div class="glow"></div>
                <div class="flame-core"></div>
                <div class="flame-wisp"></div>
            </div>
        </div>

        <!-- User's voice — single line just above the table's near edge -->
        <div class="user-voice" id="user-messages"></div>

        <div class="room-bottom-fade"></div>

        <div class="user-input-area" id="user-input-area">
            <div class="user-input-bar">
                <input type="text" id="user-input" placeholder="">
                <span class="arrow">—</span>
            </div>
        </div>

        <!-- Closing state — appears after thread ends -->
        <div id="closing-options" class="closing-options">
          <p class="closing-line">The reading is yours to keep.</p>
          <div class="closing-buttons">
            <button class="closing-button" id="btn-take" type="button">[ take it with you ]</button>
            <button class="closing-button" id="btn-snuff" type="button">[ snuff the candle ]</button>
          </div>
        </div>

        <!-- Exit overlay — hidden by default, fades to black on snuff -->
        <div id="exit-overlay" class="exit-overlay"></div>
    </div>

    <div id="threshold">
        <div class="sigil">✦</div>
        <div class="wait-text">A room is waiting...</div>
    </div>

    <div id="name-gate">
        <div class="name-gate-text">What shall I call you?</div>
        <div class="name-gate-input-area">
            <input type="text" id="name-input" placeholder="">
            <span class="name-gate-arrow">—</span>
        </div>
    </div>
<p id="interaction-hint" class="interaction-hint"></p>
</body>
</html>
