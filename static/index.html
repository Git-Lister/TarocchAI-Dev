<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TarocchAI — The Liminal Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
</head>
<body>

    <div id="scene">

        <div id="candle-light"></div>

        <!-- Threshold -->
        <div id="threshold">
            <div class="sigil">✦</div>
            <div class="wait-text">Silence gathers...</div>
        </div>

        <!-- Room -->
        <div id="room">

            <div class="table" id="table">

                <!-- Name Gate -->
                <div class="name-gate" id="name-gate" style="display:none;">
                    <div class="name-gate-text">"By what name shall I know you?"</div>
                    <div class="name-gate-input-area">
                        <input type="text" id="name-input" placeholder="..." />
                        <span class="name-gate-arrow">↵</span>
                    </div>
                </div>

                <!-- DECK AREA -->
                <div class="deck-area" id="deck-area">
                    <!-- Cards injected by JS -->
                </div>

                <!-- BOTTOM BAR -->
                <div class="bottom-bar">
                    <!-- Voice Area -->
                    <div class="voice-area" id="voice-text">
                        <!-- Sentences injected by JS -->
                    </div>

                    <!-- Input Bar -->
                    <div class="input-bar" id="user-input-area">
                        <input type="text" id="user-input" placeholder="..." />
                        <span class="input-arrow">↵</span>
                    </div>
                </div>

                <!-- Interaction Hint -->
                <div class="interaction-hint" id="interaction-hint">
                    — speak when you are ready —
                </div>

            </div>
        </div>

        <!-- Candle -->
        <div class="candle-container" id="candle-container">
            <div class="candle-flame" id="flame"></div>
            <div class="candle-wick"></div>
            <div class="candle-body"></div>
        </div>

    </div>

</body>
</html>
