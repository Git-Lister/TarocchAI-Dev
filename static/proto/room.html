<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TarocchAI — Composition Refined</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=JetBrains+Mono:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --parchment: #d9d0c1;
  --gold: #b89b4b;
  --font-alive: 'JetBrains Mono', monospace;
  --font-still: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #050301;
  font-family: var(--font-still);
  color: var(--parchment);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.scene {
  position: relative;
  width: 100vw; height: 100vh;
  overflow: hidden;
}

/* ============================================================
   ROOM — chequer corridor, field at horizon
   ============================================================ */
.room-base {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 50% 38%,
      rgba(70,40,18,0.5) 0%, rgba(35,18,10,0.6) 40%, transparent 80%),
    linear-gradient(to bottom, #060301 0%, #0a0604 40%, #080402 70%, #030201 100%);
  z-index: 0;
}
.room-base::after {
  content: ""; position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.14'/%3E%3C/svg%3E");
  mix-blend-mode: overlay; pointer-events: none;
}
.room-perspective {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0;
  perspective: 480px; perspective-origin: 50% 34%;
  overflow: hidden; z-index: 1;
}
.room-floor-plane {
  position: absolute;
  left: -80%; right: -80%;
  top: 34%; bottom: -180%;
  transform: rotateX(72deg);
  transform-origin: 50% 0%;
  background-image:
    repeating-conic-gradient(rgba(184,155,75,0.5) 0% 25%, transparent 0% 50%);
  background-size: 48px 48px;
  -webkit-mask-image: radial-gradient(ellipse 70% 90% at 50% 0%, black 15%, black 55%, transparent 100%);
          mask-image: radial-gradient(ellipse 70% 90% at 50% 0%, black 15%, black 55%, transparent 100%);
}
.room-ceiling {
  position: absolute; left: 0; right: 0; top: 0; bottom: 66%;
  perspective: 480px; perspective-origin: 50% 100%;
  overflow: hidden; z-index: 1;
}
.room-ceiling-plane {
  position: absolute;
  left: -80%; right: -80%;
  top: -180%; bottom: 34%;
  transform: rotateX(-72deg);
  transform-origin: 50% 100%;
  background-image:
    repeating-conic-gradient(rgba(184,155,75,0.20) 0% 25%, transparent 0% 50%);
  background-size: 48px 48px;
  -webkit-mask-image: radial-gradient(ellipse 70% 90% at 50% 100%, black 15%, black 55%, transparent 100%);
          mask-image: radial-gradient(ellipse 70% 90% at 50% 100%, black 15%, black 55%, transparent 100%);
}
.horizon {
  position: absolute; left: 0; right: 0; top: 20%; height: 12%;
  z-index: 2; pointer-events: none;
  background: radial-gradient(ellipse 55% 80% at 50% 50%,
    rgba(0,0,0,0.85) 0%, rgba(20,10,5,0.6) 30%, rgba(0,0,0,0.4) 60%, transparent 100%);
  filter: blur(6px);
}
.field {
  position: absolute; left: 32%; right: 32%;
  top: 20%; height: 12%;
  z-index: 3; pointer-events: none;
  filter: blur(32px);
  -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 72%);
          mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 72%);
}
.field-layer { position: absolute; inset: 0; border-radius: 50%; mix-blend-mode: screen; }
.field-layer.l1 {
  background: radial-gradient(ellipse at 42% 48%,
    rgba(184,155,75,0.55) 0%, rgba(140,90,45,0.20) 45%, transparent 75%);
  animation: field-a 9s ease-in-out infinite;
}
.field-layer.l2 {
  background: radial-gradient(ellipse at 58% 52%,
    rgba(140,90,45,0.42) 0%, rgba(100,50,25,0.15) 50%, transparent 78%);
  animation: field-b 13s ease-in-out infinite;
}
.field-layer.l3 {
  background: radial-gradient(ellipse at 50% 44%,
    rgba(140,26,26,0.30) 0%, transparent 62%);
  animation: field-c 17s ease-in-out infinite;
}
@keyframes field-a { 0%,100%{opacity:.6;transform:scale(1) translateY(0);} 50%{opacity:1;transform:scale(1.08) translateY(-3px);} }
@keyframes field-b { 0%,100%{opacity:.8;transform:scale(1.02) translateY(2px);} 50%{opacity:.55;transform:scale(.96) translateY(-2px);} }
@keyframes field-c { 0%,100%{opacity:.5;transform:scale(1);} 50%{opacity:.9;transform:scale(1.1);} }

/* ============================================================
   THE SLAB — table, pushed down
   ============================================================ */
.slab {
  position: absolute;
  left: 50%; top: 58%;
  transform: translate(-50%, -50%);
  width: 84%; height: 46%;
  z-index: 10;
  clip-path: polygon(6% 0, 94% 0, 100% 82%, 100% 100%, 0 100%, 0 82%);
  filter:
    drop-shadow(0 22px 30px rgba(0,0,0,0.9))
    drop-shadow(0 4px 8px rgba(0,0,0,0.7));
}
.slab-top {
  position: absolute;
  left: 0; right: 0;
  top: 0; height: 82%;
  background:
    radial-gradient(ellipse 60% 70% at 50% 45%,
      rgba(70,26,18,0.92) 0%, rgba(45,14,10,0.96) 50%, rgba(25,8,6,0.99) 100%);
  overflow: hidden;
}
.slab-top::before {
  content: ""; position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='t'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23t)' opacity='0.4'/%3E%3C/svg%3E");
  mix-blend-mode: overlay; pointer-events: none;
}
.slab-pattern {
  position: absolute;
  left: 3%; right: 3%;
  top: 6%; bottom: 6%;
  overflow: hidden;
  -webkit-mask-image: radial-gradient(ellipse 94% 98% at 50% 50%, black 62%, transparent 100%);
          mask-image: radial-gradient(ellipse 94% 98% at 50% 50%, black 62%, transparent 100%);
}
.slab-pattern svg { width: 100%; height: 100%; display: block; }
/* The line of the table's far edge — the gold thread */
.slab-far-line {
  position: absolute;
  left: 5%; right: 5%;
  top: 4%;
  height: 1px;
  background: linear-gradient(to right,
    transparent 0%, rgba(184,155,75,0.30) 15%,
    rgba(212,175,55,0.55) 50%,
    rgba(184,155,75,0.30) 85%, transparent 100%);
  filter: blur(0.5px);
  z-index: 5;
}
/* ornamental frame (inner) */
.slab-frame {
  position: absolute;
  left: 5%; right: 5%;
  top: 6%; bottom: 16%;
  clip-path: polygon(4% 0, 96% 0, 100% 100%, 0 100%);
  border: 1px solid rgba(184,155,75,0.32);
  pointer-events: none;
  z-index: 4;
}
.slab-frame::before {
  content: ""; position: absolute; inset: 5px;
  border: 1px solid rgba(184,155,75,0.14);
}
.slab-far-shadow {
  position: absolute;
  left: 0; right: 0;
  top: 0; height: 14%;
  background: linear-gradient(to bottom,
    rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 60%, transparent 100%);
  pointer-events: none;
  z-index: 3;
}
.slab-face {
  position: absolute;
  left: 0; right: 0;
  bottom: 0; height: 18%;
  background: linear-gradient(to bottom,
    rgba(30,12,8,0.98) 0%,
    rgba(18,7,5,1) 40%,
    rgba(8,3,2,1) 100%);
  z-index: 4;
}
.slab-face::before {
  content: ""; position: absolute;
  left: 0; right: 0; top: 0; height: 1px;
  background: linear-gradient(to right,
    transparent 0%, rgba(184,155,75,0.28) 12%,
    rgba(212,175,55,0.5) 50%,
    rgba(184,155,75,0.28) 88%, transparent 100%);
  filter: blur(0.6px);
}

/* ============================================================
   MT'S VOICE ZONE — on the table, above the cards
   ============================================================ */
.mt-voice {
  position: absolute;
  left: 50%; top: 8%;
  transform: translateX(-50%);
  width: 78%;
  z-index: 8;
  display: flex;
  flex-direction: column;
  gap: 5px;
  pointer-events: none;
}
.mt-line {
  font-family: var(--font-alive);
  font-weight: 300;
  font-style: italic;
  font-size: 17px;
  line-height: 1.5;
  color: var(--parchment);
  text-shadow:
    0 0 18px rgba(184,155,75,0.30),
    0 0 45px rgba(140,90,40,0.14),
    0 2px 4px rgba(0,0,0,0.85);
  letter-spacing: 0.005em;
  text-align: center;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.mt-line.visible { opacity: 1; transform: translateY(0); }
.mt-line.fading { opacity: 0.28; transform: translateY(-4px); }

/* ============================================================
   CARDS — moved down on the table
   ============================================================ */
.cards-row {
  position: absolute;
  left: 50%; top: 46%;
  transform: translateX(-50%);
  display: flex;
  gap: 26px;
  z-index: 20;
}
.card {
  width: clamp(90px, 8vw, 120px);
  aspect-ratio: 170 / 264;
  background: linear-gradient(160deg, #1a1612 0%, #0f0c09 100%);
  border: 1px solid rgba(184,155,75,0.55);
  border-radius: 4px;
  box-shadow:
    0 14px 30px rgba(0,0,0,0.85),
    0 0 40px rgba(212,175,55,0.10),
    inset 0 0 16px rgba(212,175,55,0.05);
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.card::before {
  content: ""; position: absolute; inset: 5px;
  border: 1px solid rgba(184,155,75,0.2);
  border-radius: 2px;
}
.card::after {
  content: ""; position: absolute;
  width: 42%; aspect-ratio: 1;
  border-radius: 50%;
  border: 1px solid rgba(184,155,75,0.35);
  box-shadow: inset 0 0 8px rgba(184,155,75,0.15);
}
.card.tilt-l { transform: rotate(-3deg) translateY(3px); }
.card.tilt-c { transform: translateY(-2px); }
.card.tilt-r { transform: rotate(3deg) translateY(3px); }

/* ============================================================
   FLOATING FLAME — the candle replacement
   ============================================================ */
.floating-flame {
  position: absolute;
  right: 18%; top: 44%;
  width: 40px; height: 60px;
  z-index: 22;
  pointer-events: auto; cursor: pointer;
}
.floating-flame .glow {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 180px; height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255,180,60,0.18) 0%,
    rgba(255,140,40,0.08) 35%,
    transparent 70%);
  filter: blur(14px);
  animation: glow-pulse 4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes glow-pulse {
  0%,100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
  50%     { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
}
.floating-flame .flame-core {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 12px; height: 26px;
  border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
  background: radial-gradient(ellipse at 50% 70%,
    #fffbe6 0%,
    #f8dd6a 20%,
    #f4a13c 45%,
    rgba(220,80,20,0.7) 75%,
    transparent 100%);
  filter:
    blur(0.4px)
    drop-shadow(0 0 12px rgba(255,220,120,1))
    drop-shadow(0 0 32px rgba(255,160,60,0.7))
    drop-shadow(0 0 70px rgba(255,100,20,0.4));
  animation: flame-drift 3.4s ease-in-out infinite;
  transform-origin: 50% 100%;
}
@keyframes flame-drift {
  0%,100% { transform: translate(-50%, -50%) scale(1,1) rotate(-1deg); opacity: 0.96; }
  25%     { transform: translate(-48%, -52%) scale(0.94,1.08) rotate(1.5deg); opacity: 1; }
  50%     { transform: translate(-52%, -48%) scale(1.06,0.94) rotate(-2deg); opacity: 0.9; }
  75%     { transform: translate(-50%, -51%) scale(0.97,1.04) rotate(1.2deg); opacity: 0.98; }
}
/* soft inner wisp */
.floating-flame .flame-wisp {
  position: absolute;
  left: 50%; top: 44%;
  transform: translate(-50%, -50%);
  width: 6px; height: 14px;
  border-radius: 50%;
  background: radial-gradient(ellipse at 50% 60%,
    #ffffff 0%, #fff5cc 50%, transparent 100%);
  filter: blur(1.5px);
  animation: wisp 3.4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes wisp {
  0%,100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
  50%     { opacity: 0.9; transform: translate(-52%, -55%) scale(1.15); }
}

/* ============================================================
   USER'S VOICE — single line just above the table's near edge
   ============================================================ */
.user-voice {
  position: absolute;
  left: 50%; top: 90%;
  transform: translate(-50%, -50%);
  max-width: 62%;
  font-family: var(--font-alive);
  font-weight: 300;
  font-style: italic;
  font-size: 14px;
  color: rgba(217,208,193,0.75);
  text-align: center;
  letter-spacing: 0.005em;
  text-shadow:
    0 0 14px rgba(184,155,75,0.22),
    0 2px 4px rgba(0,0,0,0.9);
  z-index: 14;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  transition: opacity 0.7s ease;
}
.user-voice.visible { opacity: 1; }
.user-voice.fading { opacity: 0; }

/* ============================================================
   USER INPUT — small bar at very bottom
   ============================================================ */
.user-input-area {
  position: absolute;
  left: 24%; right: 24%;
  bottom: 1.5%;
  z-index: 50;
}
.user-input-bar {
  width: 100%; height: 32px;
  background: rgba(15,10,7,0.72);
  border: 1px solid rgba(184,155,75,0.20);
  border-radius: 2px;
  display: flex; align-items: center; padding: 0 16px;
  font-family: var(--font-alive); font-weight: 300; font-style: italic;
  font-size: 12.5px; color: var(--parchment);
  backdrop-filter: blur(8px);
  box-shadow: 0 6px 22px rgba(0,0,0,0.7), inset 0 1px 0 rgba(184,155,75,0.06);
}
.user-input-bar .placeholder { color: rgba(140,120,80,0.65); }
.user-input-bar .arrow {
  position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%);
  color: rgba(184,155,75,0.30);
  font-size: 10px;
}
.room-bottom-fade {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 8%;
  background: linear-gradient(to bottom,
    transparent 0%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.9) 100%);
  z-index: 40;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="scene">
  <div class="room-base"></div>
  <div class="room-perspective"><div class="room-floor-plane"></div></div>
  <div class="room-ceiling"><div class="room-ceiling-plane"></div></div>
  <div class="horizon"></div>

  <div class="field">
    <div class="field-layer l1"></div>
    <div class="field-layer l2"></div>
    <div class="field-layer l3"></div>
  </div>

  <div class="slab">
    <div class="slab-top">
      <div class="slab-pattern" id="slab-pattern"></div>
      <div class="slab-far-line"></div>
      <div class="slab-frame"></div>
      <div class="slab-far-shadow"></div>
    </div>
    <div class="slab-face"></div>

    <!-- MT's voice — materialises on the table, above the cards -->
    <div class="mt-voice">
      <div class="mt-line fading">Ah, D. The cards have been waiting.</div>
      <div class="mt-line visible">Rest your eyes at its centre. Let something rise — and describe what you see.</div>
    </div>

    <!-- Cards — moved down closer to user -->
    <div class="cards-row">
      <div class="card tilt-l"></div>
      <div class="card tilt-c"></div>
      <div class="card tilt-r"></div>
    </div>

    <!-- Floating flame candle — total juxtaposition -->
    <div class="floating-flame">
      <div class="glow"></div>
      <div class="flame-core"></div>
      <div class="flame-wisp"></div>
    </div>
  </div>

  <!-- User's voice — single line at near edge -->
  <div class="user-voice visible">I see a door, half open.</div>

  <div class="room-bottom-fade"></div>

  <div class="user-input-area">
    <div class="user-input-bar">
      <span class="placeholder">the room is listening</span>
      <span class="arrow">—</span>
    </div>
  </div>
</div>

<script>
const SVG_NS = 'http://www.w3.org/2000/svg';

function makeUse(symId, x, y, color, scale) {
  const u = document.createElementNS(SVG_NS, 'use');
  u.setAttribute('href', '#' + symId);
  u.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#' + symId);
  u.setAttribute('x', x);
  u.setAttribute('y', y);
  u.setAttribute('color', color);
  if (scale !== undefined && scale !== 1) {
    u.setAttribute('transform', `translate(${x},${y}) scale(${scale}) translate(${-x},${-y})`);
  }
  return u;
}

(function buildPattern() {
  const container = document.getElementById('slab-pattern');
  if (!container) return;
  const W = 900, H = 500;
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');

  const defs = document.createElementNS(SVG_NS, 'defs');
  const sunG = document.createElementNS(SVG_NS, 'g');
  sunG.setAttribute('id', 'sun-inline');
  const dot = document.createElementNS(SVG_NS, 'circle');
  dot.setAttribute('r', '0.9');
  dot.setAttribute('fill', 'currentColor');
  sunG.appendChild(dot);
  const rays = document.createElementNS(SVG_NS, 'g');
  rays.setAttribute('stroke', 'currentColor');
  rays.setAttribute('stroke-width', '0.45');
  rays.setAttribute('stroke-linecap', 'round');
  rays.setAttribute('fill', 'none');
  [
    [0,-1.6,0,-2.6], [0,1.6,0,2.6], [-1.6,0,-2.6,0], [1.6,0,2.6,0],
    [-1.2,-1.2,-1.85,-1.85], [1.2,1.2,1.85,1.85],
    [-1.2,1.2,-1.85,1.85], [1.2,-1.2,1.85,-1.85]
  ].forEach(([x1,y1,x2,y2]) => {
    const l = document.createElementNS(SVG_NS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    rays.appendChild(l);
  });
  sunG.appendChild(rays);
  defs.appendChild(sunG);
  svg.appendChild(defs);

  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const cx = W / 2, cy = H / 2;
  const count = 1800;
  const maxR = 480;

  for (let i = 0; i < count; i++) {
    const r = Math.sqrt(i / count) * maxR;
    const theta = i * GOLDEN;
    const x = cx + r * Math.cos(theta);
    const y = cy + r * Math.sin(theta);
    const dist = r / maxR;
    const op = Math.max(0.15, 1 - dist);
    const size = 0.75 + (1 - dist) * 0.4;
    const col = `rgba(200,168,90,${op * 0.85})`;
    const u = makeUse('sun-inline', x, y, col, size);
    svg.appendChild(u);
  }

  const core = document.createElementNS(SVG_NS, 'radialGradient');
  core.setAttribute('id', 'slab-core');
  const s1 = document.createElementNS(SVG_NS, 'stop');
  s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', 'rgba(0,0,0,0.5)');
  const s2 = document.createElementNS(SVG_NS, 'stop');
  s2.setAttribute('offset', '35%'); s2.setAttribute('stop-color', 'rgba(0,0,0,0)');
  core.appendChild(s1); core.appendChild(s2);
  const defs2 = document.createElementNS(SVG_NS, 'defs');
  defs2.appendChild(core);
  svg.insertBefore(defs2, svg.firstChild);

  const c = document.createElementNS(SVG_NS, 'circle');
  c.setAttribute('cx', cx); c.setAttribute('cy', cy);
  c.setAttribute('r', 90); c.setAttribute('fill', 'url(#slab-core)');
  svg.appendChild(c);

  container.appendChild(svg);
})();
</script>
</body>
</html>
